name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p dist
          for f in *.html *.css *.js *.json *.png *.webp *.svg *.ico; do
            if [ -f "$f" ] && [ "$f" != "server.js" ] && [ "$f" != "cloudflare-worker.js" ] && [ "$f" != "package.json" ] && [ "$f" != "package-lock.json" ] && [ "$f" != "capacitor.config.json" ] && [ "$f" != "tsconfig.json" ]; then
              cp "$f" dist/
            fi
          done
          if [ -d "public" ]; then
            cp -r public/* dist/ 2>/dev/null || true
          fi

      - name: Install Capacitor & Generate Android Project
        run: |
          rm -f package.json package-lock.json bun.lock
          echo '{"name":"ephone-apk","version":"1.0.0","private":true}' > package.json
          npm install --no-package-lock @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Configure Android Fullscreen & Cleartext Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true" android:largeHeap="true"/g' "$MANIFEST" || true
          fi
          STYLES="android/app/src/main/res/values/styles.xml"
          if [ -f "$STYLES" ]; then
            sed -i 's/Theme.AppCompat.DayNight.NoActionBar/Theme.AppCompat.DayNight.NoActionBar/g' "$STYLES" || true
          fi

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPhone-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
