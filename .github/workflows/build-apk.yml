      - name: Configure Android App Name, Custom Icons, Native Bridge & Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>\n    <application android:usesCleartextTraffic="true" android:largeHeap="true" android:requestLegacyExternalStorage="true"/g' "$MANIFEST" || true
          fi
          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            sed -i 's/>EPhone</>四半世紀</g' "$STRINGS" || true
          fi
          RES_DIR="android/app/src/main/res"
          ICON_SRC="icon-512.png"
          if [ ! -f "$ICON_SRC" ]; then
            ICON_SRC="icon.png"
          fi
          if [ -f "$ICON_SRC" ] && [ -d "$RES_DIR" ]; then
            rm -rf "$RES_DIR"/mipmap-anydpi-v26 2>/dev/null || true
            for d in "$RES_DIR"/mipmap-*; do
              if [ -d "$d" ]; then
                cp -f "$ICON_SRC" "$d/ic_launcher.png"
                cp -f "$ICON_SRC" "$d/ic_launcher_round.png"
                cp -f "$ICON_SRC" "$d/ic_launcher_foreground.png"
              fi
            done
          fi
          CAP_WV=$(find node_modules/@capacitor/android -name "CapacitorWebView.java" | head -n 1)
          if [ -n "$CAP_WV" ] && [ -f "$CAP_WV" ]; then
            cat << 'CAP_EOF' > "$CAP_WV"
          package com.getcapacitor;

          import android.content.Context;
          import android.util.AttributeSet;
          import android.util.Base64;
          import android.view.ActionMode;
          import android.view.KeyEvent;
          import android.view.Menu;
          import android.view.MenuItem;
          import android.view.View;
          import android.view.inputmethod.BaseInputConnection;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputConnection;
          import android.webkit.WebView;
          import java.nio.charset.StandardCharsets;

          public class CapacitorWebView extends WebView {
              private BaseInputConnection capInputConnection;
              private Bridge bridge;

              private static final int MENU_ID_SELECT_ALL = 0x7011;
              private static final int MENU_ID_COPY = 0x7012;
              private static final int MENU_ID_CUT = 0x7013;

              public CapacitorWebView(Context context, AttributeSet attrs) {
                  super(context, attrs);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                      setImportantForAutofill(View.IMPORTANT_FOR_AUTOFILL_NO_EXCLUDE_DESCENDANTS);
                  }
              }

              public void setBridge(Bridge bridge) {
                  this.bridge = bridge;
              }

              @Override
              public int getAutofillType() {
                  return View.AUTOFILL_TYPE_NONE;
              }

              @Override
              public InputConnection onCreateInputConnection(EditorInfo outAttrs) {
                  return super.onCreateInputConnection(outAttrs);
              }

              private ActionMode.Callback wrapActionModeCallback(final ActionMode.Callback orig) {
                  if (orig == null) return null;
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M && orig instanceof ActionMode.Callback2) {
                      final ActionMode.Callback2 orig2 = (ActionMode.Callback2) orig;
                      return new ActionMode.Callback2() {
                          @Override
                          public boolean onCreateActionMode(ActionMode mode, Menu menu) {
                              boolean res = orig2.onCreateActionMode(mode, menu);
                              enrichCursorMenu(menu);
                              return res;
                          }

                          @Override
                          public boolean onPrepareActionMode(ActionMode mode, Menu menu) {
                              boolean res = orig2.onPrepareActionMode(mode, menu);
                              enrichCursorMenu(menu);
                              return res;
                          }

                          @Override
                          public boolean onActionItemClicked(ActionMode mode, MenuItem item) {
                              if (handleEnrichedMenuClick(mode, item)) return true;
                              return orig2.onActionItemClicked(mode, item);
                          }

                          @Override
                          public void onDestroyActionMode(ActionMode mode) {
                              orig2.onDestroyActionMode(mode);
                          }

                          @Override
                          public void onGetContentRect(ActionMode mode, View view, android.graphics.Rect outRect) {
                              orig2.onGetContentRect(mode, view, outRect);
                          }
                      };
                  }
                  return new ActionMode.Callback() {
                      @Override
                      public boolean onCreateActionMode(ActionMode mode, Menu menu) {
                          boolean res = orig.onCreateActionMode(mode, menu);
                          enrichCursorMenu(menu);
                          return res;
                      }

                      @Override
                      public boolean onPrepareActionMode(ActionMode mode, Menu menu) {
                          boolean res = orig.onPrepareActionMode(mode, menu);
                          enrichCursorMenu(menu);
                          return res;
                      }

                      @Override
                      public boolean onActionItemClicked(ActionMode mode, MenuItem item) {
                          if (handleEnrichedMenuClick(mode, item)) return true;
                          return orig.onActionItemClicked(mode, item);
                      }

                      @Override
                      public void onDestroyActionMode(ActionMode mode) {
                          orig.onDestroyActionMode(mode);
                      }
                  };
              }

              private void enrichCursorMenu(Menu menu) {
                  if (menu == null) return;
                  boolean hasSelectAll = false;
                  boolean hasCopy = false;
                  boolean hasCut = false;
                  for (int i = menu.size() - 1; i >= 0; i--) {
                      MenuItem item = menu.getItem(i);
                      if (item == null || item.getTitle() == null) continue;
                      String t = item.getTitle().toString().trim();
                      String tl = t.toLowerCase();
                      if (t.contains("自动填充") || tl.contains("autofill")) {
                          menu.removeItem(item.getItemId());
                      } else if (t.contains("全选") || tl.contains("select all")) {
                          hasSelectAll = true;
                      } else if (t.contains("复制") || tl.contains("copy")) {
                          hasCopy = true;
                      } else if (t.contains("剪切") || tl.contains("cut")) {
                          hasCut = true;
                      }
                  }
                  if (!hasSelectAll && menu.findItem(MENU_ID_SELECT_ALL) == null) {
                      MenuItem sa = menu.add(0, MENU_ID_SELECT_ALL, 1, "全选");
                      sa.setShowAsAction(MenuItem.SHOW_AS_ACTION_ALWAYS);
                  }
                  if (!hasCopy && menu.findItem(MENU_ID_COPY) == null) {
                      MenuItem cp = menu.add(0, MENU_ID_COPY, 2, "复制");
                      cp.setShowAsAction(MenuItem.SHOW_AS_ACTION_ALWAYS);
                  }
                  if (!hasCut && menu.findItem(MENU_ID_CUT) == null) {
                      MenuItem ct = menu.add(0, MENU_ID_CUT, 3, "剪切");
                      ct.setShowAsAction(MenuItem.SHOW_AS_ACTION_IF_ROOM);
                  }
              }

              private boolean handleEnrichedMenuClick(ActionMode mode, MenuItem item) {
                  if (item == null) return false;
                  int id = item.getItemId();
                  if (id == MENU_ID_SELECT_ALL) {
                      evaluateJavascript("window.__ephoneSelectAllActiveInput && window.__ephoneSelectAllActiveInput();", null);
                      return true;
                  }
                  if (id == MENU_ID_COPY) {
                      evaluateJavascript("window.__ephoneCopyActiveInput && window.__ephoneCopyActiveInput();", null);
                      if (mode != null) mode.finish();
                      return true;
                  }
                  if (id == MENU_ID_CUT) {
                      evaluateJavascript("window.__ephoneCutActiveInput && window.__ephoneCutActiveInput();", null);
                      if (mode != null) mode.finish();
                      return true;
                  }
                  return false;
              }

              @Override
              public ActionMode startActionMode(ActionMode.Callback callback) {
                  return super.startActionMode(wrapActionModeCallback(callback));
              }

              @Override
              public ActionMode startActionMode(ActionMode.Callback callback, int type) {
                  return super.startActionMode(wrapActionModeCallback(callback), type);
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  if (event.getAction() == KeyEvent.ACTION_MULTIPLE && event.getCharacters() != null) {
                      String chars = event.getCharacters();
                      String b64 = Base64.encodeToString(chars.getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                      evaluateJavascript("window.__ephoneInsertNativeInputTextFromB64 && window.__ephoneInsertNativeInputTextFromB64('" + b64 + "');", null);
                      return true;
                  }
                  return super.dispatchKeyEvent(event);
              }
          }
          CAP_EOF
          fi
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ] && [ -f "$MAIN_ACT" ]; then
            PKG_LINE=$(grep -E '^package ' "$MAIN_ACT" | head -n 1)
            cat << 'EOF' > "$MAIN_ACT"
          package com.ephone.companion.app;

          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.content.res.AssetManager;
          import android.media.MediaScannerConnection;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.autofill.AutofillManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends BridgeActivity {
              private void triggerWebViewStepBack() {
                  try {
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          final WebView wv = this.bridge.getWebView();
                          wv.post(() -> wv.evaluateJavascript(
                              "if (typeof window.__handleEPhoneBackAction === 'function') { window.__handleEPhoneBackAction(); } else { window.history.back(); }",
                              null
                          ));
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                          @Override
                          public void handleOnBackPressed() {
                              triggerWebViewStepBack();
                          }
                      });
                  } catch (Exception ignored) {}
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          if (getWindow() != null && getWindow().getDecorView() != null) {
                              getWindow().getDecorView().setImportantForAutofill(View.IMPORTANT_FOR_AUTOFILL_NO_EXCLUDE_DESCENDANTS);
                          }
                          AutofillManager afm = getSystemService(AutofillManager.class);
                          if (afm != null) {
                              afm.cancel();
                          }
                      }
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          WebView webView = this.bridge.getWebView();
                          WebSettings ws = webView.getSettings();
                          ws.setDomStorageEnabled(true);
                          ws.setDatabaseEnabled(true);
                          ws.setJavaScriptCanOpenWindowsAutomatically(true);
                          ws.setAllowFileAccess(true);
                          ws.setAllowContentAccess(true);
                          ws.setSaveFormData(false);
                          webView.setLongClickable(true);
                          webView.setHapticFeedbackEnabled(true);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              webView.setImportantForAutofill(View.IMPORTANT_FOR_AUTOFILL_NO_EXCLUDE_DESCENDANTS);
                          }
                          webView.addJavascriptInterface(new EPhoneNativeBridge(this), "EPhoneNativeBridge");
                      }
                      checkAndApplyPersistedHotUpdate();
                  } catch (Exception ignored) {}
              }

              @Override
              public void onBackPressed() {
                  triggerWebViewStepBack();
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  if (event != null && event.getKeyCode() == KeyEvent.KEYCODE_BACK) {
                      if (event.getAction() == KeyEvent.ACTION_UP && !event.isCanceled()) {
                          triggerWebViewStepBack();
                      }
                      return true;
                  }
                  return super.dispatchKeyEvent(event);
              }

              private long getCurrentApkUpdateTime() {
                  try {
                      PackageInfo pi = getPackageManager().getPackageInfo(getPackageName(), 0);
                      return pi != null ? pi.lastUpdateTime : 0L;
                  } catch (Exception e) {
                      return 0L;
                  }
              }

              private void deleteDirRecursively(File f) {
                  if (f == null || !f.exists()) return;
                  if (f.isDirectory()) {
                      File[] children = f.listFiles();
                      if (children != null) {
                          for (File c : children) {
                              deleteDirRecursively(c);
                          }
                      }
                  }
                  try { f.delete(); } catch (Exception ignored) {}
              }

              private void copyAssetsRecursively(AssetManager am, String assetPath, File destDir) {
                  try {
                      String[] list = am.list(assetPath);
                      if (list != null && list.length > 0) {
                          if (!destDir.exists()) destDir.mkdirs();
                          for (String child : list) {
                              String childAssetPath = assetPath.isEmpty() ? child : (assetPath + "/" + child);
                              copyAssetsRecursively(am, childAssetPath, new File(destDir, child));
                          }
                      } else {
                          if (destDir.exists()) return;
                          File parent = destDir.getParentFile();
                          if (parent != null && !parent.exists()) parent.mkdirs();
                          try (InputStream is = am.open(assetPath);
                               FileOutputStream fos = new FileOutputStream(destDir)) {
                              byte[] buf = new byte[8192];
                              int n;
                              while ((n = is.read(buf)) > 0) {
                                  fos.write(buf, 0, n);
                              }
                              fos.flush();
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private void checkAndApplyPersistedHotUpdate() {
                  try {
                      File hotDir = new File(getFilesDir(), "hot_update_www");
                      File markerFile = new File(hotDir, ".apk_update_time");
                      File indexFile = new File(hotDir, "index.html");
                      if (!hotDir.exists() || !indexFile.exists()) return;
                      long curApkTime = getCurrentApkUpdateTime();
                      long savedApkTime = 0L;
                      if (markerFile.exists()) {
                          try (FileInputStream fis = new FileInputStream(markerFile);
                               ByteArrayOutputStream bos = new ByteArrayOutputStream()) {
                              byte[] buf = new byte[128];
                              int r;
                              while ((r = fis.read(buf)) > 0) bos.write(buf, 0, r);
                              savedApkTime = Long.parseLong(new String(bos.toByteArray(), StandardCharsets.UTF_8).trim());
                          } catch (Exception ignored) {}
                      }
                      if (curApkTime > 0 && savedApkTime != curApkTime) {
                          deleteDirRecursively(hotDir);
                          return;
                      }
                      if (this.bridge != null) {
                          this.bridge.setServerBasePath(hotDir.getAbsolutePath());
                      }
                  } catch (Exception ignored) {}
              }

              public boolean prepareHotUpdateWorkspace() {
                  try {
                      File hotDir = new File(getFilesDir(), "hot_update_www");
                      if (!hotDir.exists()) hotDir.mkdirs();
                      copyAssetsRecursively(getAssets(), "public", hotDir);
                      long curApkTime = getCurrentApkUpdateTime();
                      File markerFile = new File(hotDir, ".apk_update_time");
                      try (FileOutputStream fos = new FileOutputStream(markerFile)) {
                          fos.write(String.valueOf(curApkTime).getBytes(StandardCharsets.UTF_8));
                          fos.flush();
                      }
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              public boolean writeHotUpdateFile(String relativePath, String content) {
                  try {
                      if (relativePath == null || relativePath.trim().isEmpty() || content == null) return false;
                      String cleanRel = relativePath.trim().replaceAll("^/+", "");
                      if (cleanRel.contains("..")) return false;
                      File hotDir = new File(getFilesDir(), "hot_update_www");
                      if (!hotDir.exists()) {
                          prepareHotUpdateWorkspace();
                      }
                      File outFile = new File(hotDir, cleanRel);
                      File parent = outFile.getParentFile();
                      if (parent != null && !parent.exists()) parent.mkdirs();
                      try (FileOutputStream fos = new FileOutputStream(outFile)) {
                          fos.write(content.getBytes(StandardCharsets.UTF_8));
                          fos.flush();
                      }
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              public boolean activateHotUpdateWorkspace() {
                  try {
                      final File hotDir = new File(getFilesDir(), "hot_update_www");
                      final File indexFile = new File(hotDir, "index.html");
                      if (!indexFile.exists() || this.bridge == null) return false;
                      runOnUiThread(() -> {
                          try {
                              if (MainActivity.this.bridge.getWebView() != null) {
                                  MainActivity.this.bridge.getWebView().clearCache(true);
                              }
                              MainActivity.this.bridge.setServerBasePath(hotDir.getAbsolutePath());
                          } catch (Exception ignored) {}
                      });
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              public static class EPhoneNativeBridge {
                  private final MainActivity activity;
                  private final Context ctx;

                  public EPhoneNativeBridge(MainActivity act) {
                      this.activity = act;
                      this.ctx = act;
                  }

                  @JavascriptInterface
                  public void exitApp() {
                      if (activity != null) {
                          activity.runOnUiThread(() -> {
                              try {
                                  activity.moveTaskToBack(true);
                                  activity.finish();
                              } catch (Exception ignored) {}
                          });
                      }
                  }

                  @JavascriptInterface
                  public boolean prepareHotUpdateDir() {
                      return activity != null && activity.prepareHotUpdateWorkspace();
                  }

                  @JavascriptInterface
                  public boolean saveHotUpdateFile(String relativePath, String content) {
                      return activity != null && activity.writeHotUpdateFile(relativePath, content);
                  }

                  @JavascriptInterface
                  public boolean applyHotUpdate() {
                      return activity != null && activity.activateHotUpdateWorkspace();
                  }

                  @JavascriptInterface
                  public boolean openExternalUrl(String url) {
                      try {
                          if (url == null || url.trim().isEmpty()) return false;
                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url.trim()));
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(intent);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean copyToClipboard(String text) {
                      try {
                          ClipboardManager cm = (ClipboardManager) ctx.getSystemService(Context.CLIPBOARD_SERVICE);
                          if (cm != null) {
                              ClipData clip = ClipData.newPlainText("text", text != null ? text : "");
                              cm.setPrimaryClip(clip);
                              return true;
                          }
                      } catch (Exception ignored) {}
                      return false;
                  }

                  @JavascriptInterface
                  public String readFromClipboard() {
                      try {
                          ClipboardManager cm = (ClipboardManager) ctx.getSystemService(Context.CLIPBOARD_SERVICE);
                          if (cm != null && cm.hasPrimaryClip()) {
                              ClipData clip = cm.getPrimaryClip();
                              if (clip != null && clip.getItemCount() > 0) {
                                  CharSequence cs = clip.getItemAt(0).coerceToText(ctx);
                                  if (cs != null) return cs.toString();
                              }
                          }
                      } catch (Exception ignored) {}
                      return "";
                  }

                  @JavascriptInterface
                  public boolean saveBase64ToDownloads(String base64Data, String fileName, String mimeType, String subFolder) {
                      try {
                          if (base64Data == null || base64Data.isEmpty()) return false;
                          String pureB64 = base64Data;
                          int commaIdx = pureB64.indexOf(',');
                          if (commaIdx >= 0) {
                              pureB64 = pureB64.substring(commaIdx + 1);
                          }
                          byte[] bytes = Base64.decode(pureB64, Base64.DEFAULT);
                          if (bytes == null || bytes.length == 0) return false;
                          String safeName = (fileName != null && !fileName.trim().isEmpty()) ? fileName.trim() : ("NAI_" + System.currentTimeMillis() + ".png");
                          String safeMime = (mimeType != null && !mimeType.trim().isEmpty()) ? mimeType.trim() : (safeName.toLowerCase().endsWith(".jpg") || safeName.toLowerCase().endsWith(".jpeg") ? "image/jpeg" : "image/png");
                          String folderName = (subFolder != null && !subFolder.trim().isEmpty()) ? subFolder.trim() : "徒花";

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentResolver resolver = ctx.getContentResolver();
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.MediaColumns.DISPLAY_NAME, safeName);
                              values.put(MediaStore.MediaColumns.MIME_TYPE, safeMime);
                              values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DCIM + "/" + folderName);
                              values.put(MediaStore.MediaColumns.IS_PENDING, 1);
                              Uri uri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values);
                              if (uri == null) {
                                  values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/" + folderName);
                                  uri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values);
                              }
                              if (uri != null) {
                                  try (OutputStream os = resolver.openOutputStream(uri)) {
                                      if (os != null) {
                                          os.write(bytes);
                                          os.flush();
                                      }
                                  }
                                  ContentValues doneValues = new ContentValues();
                                  doneValues.put(MediaStore.MediaColumns.IS_PENDING, 0);
                                  resolver.update(uri, doneValues, null, null);
                                  try {
                                      File dcimFile = new File(new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DCIM), folderName), safeName);
                                      MediaScannerConnection.scanFile(ctx, new String[]{dcimFile.getAbsolutePath()}, new String[]{safeMime}, null);
                                  } catch (Exception ignored) {}
                                  return true;
                              }
                          }

                          File baseDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DCIM);
                          File targetDir = new File(baseDir, folderName);
                          if (!targetDir.exists()) {
                              targetDir.mkdirs();
                          }
                          File outFile = new File(targetDir, safeName);
                          try (FileOutputStream fos = new FileOutputStream(outFile)) {
                              fos.write(bytes);
                              fos.flush();
                          }
                          MediaScannerConnection.scanFile(ctx, new String[]{outFile.getAbsolutePath()}, new String[]{safeMime}, null);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }
              }
          }
          EOF
            if [ -n "$PKG_LINE" ]; then
              sed -i "1s|^package .*|$PKG_LINE|" "$MAIN_ACT" || true
            fi
          fi

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../EPhone.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPhone-Android-APK
          path: EPhone.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: 小手机安卓安装包最新版
          body: 点击下方 EPhone.apk 即可直接下载安装到手机
          files: EPhone.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
