name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p dist
          for f in *.html *.css *.js *.json *.png *.webp *.svg *.ico; do
            if [ -f "$f" ] && [ "$f" != "server.js" ] && [ "$f" != "cloudflare-worker.js" ] && [ "$f" != "package.json" ] && [ "$f" != "package-lock.json" ] && [ "$f" != "capacitor.config.json" ] && [ "$f" != "tsconfig.json" ]; then
              cp "$f" dist/
            fi
          done
          if [ -d "assets" ]; then
            cp -r assets dist/ 2>/dev/null || true
          fi
          if [ -d "public" ]; then
            cp -r public/* dist/ 2>/dev/null || true
          fi
          touch dist/.nojekyll

      - name: Deploy Web Assets to GitHub Pages (gh-pages)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORK_DIR=$(pwd)
          TMP_GH=$(mktemp -d)
          cp -r dist/. "$TMP_GH"/
          cd "$TMP_GH"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy web assets for APK hot update"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages || true
          curl -s -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' || true
          cd "$WORK_DIR"
          rm -rf "$TMP_GH"

      - name: Install Capacitor & Generate Android Project
        run: |
          rm -f package.json package-lock.json bun.lock
          echo '{"name":"ephone-apk","version":"1.0.0","private":true}' > package.json
          npm install --no-package-lock @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

