name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p dist
          for f in *.html *.css *.js *.json *.png *.webp *.svg *.ico; do
            if [ -f "$f" ] && [ "$f" != "server.js" ] && [ "$f" != "cloudflare-worker.js" ] && [ "$f" != "package.json" ] && [ "$f" != "package-lock.json" ] && [ "$f" != "capacitor.config.json" ] && [ "$f" != "tsconfig.json" ]; then
              cp "$f" dist/
            fi
          done
          if [ -d "assets" ]; then
            mkdir -p dist/assets
            cp -r assets/* dist/assets/ 2>/dev/null || true
          fi
          if [ -d "public" ]; then
            cp -r public/* dist/ 2>/dev/null || true
          fi

      - name: Install Capacitor & Generate Android Project
        run: |
          rm -f package.json package-lock.json bun.lock
          echo '{"name":"ephone-apk","version":"1.0.0","private":true}' > package.json
          npm install --no-package-lock @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Configure Android App Name, Icon, Fullscreen & Cleartext Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true" android:largeHeap="true"/g' "$MANIFEST" || true
          fi
          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">四半世紀</string>|g' "$STRINGS" || true
            sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">四半世紀</string>|g' "$STRINGS" || true
          fi
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          ICON_HI="icon-512.png"
          if [ ! -f "$ICON_HI" ]; then ICON_HI="icon.png"; fi
          ICON_STD="icon-192.png"
          if [ ! -f "$ICON_STD" ]; then ICON_STD="$ICON_HI"; fi
          if [ -f "$ICON_HI" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                case "$dir" in
                  *xxhdpi*|*xxxhdpi*) SRC_IMG="$ICON_HI" ;;
                  *) SRC_IMG="$ICON_STD" ;;
                esac
                cp -f "$SRC_IMG" "$dir/ic_launcher.png"
                cp -f "$SRC_IMG" "$dir/ic_launcher_round.png"
                cp -f "$SRC_IMG" "$dir/ic_launcher_foreground.png"
              fi
            done
          fi
          STYLES="android/app/src/main/res/values/styles.xml"
          if [ -f "$STYLES" ]; then
            sed -i 's/Theme.AppCompat.DayNight.NoActionBar/Theme.AppCompat.DayNight.NoActionBar/g' "$STYLES" || true
          fi

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../EPhone.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPhone-Android-APK
          path: EPhone.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: 小手机安卓安装包最新版
          body: 点击下方 EPhone.apk 即可直接下载安装到手机
          files: EPhone.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
