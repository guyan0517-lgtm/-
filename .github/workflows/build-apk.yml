          public class MainActivity extends BridgeActivity {
              private static final String NOTIF_CHANNEL_ID = "ephone_high_priority_msg_v1";
              private static final int REQ_POST_NOTIF = 1091;
              private static final int REQ_RECORD_AUDIO = 1092;
              private boolean allowExplicitExit = false;

              private final OnBackPressedCallback ephoneBackCallback = new OnBackPressedCallback(true) {
                  @Override
                  public void handleOnBackPressed() {
                      triggerWebViewStepBack();
                  }
              };

              private void ensureTopBackCallback() {
                  try {
                      ephoneBackCallback.remove();
                      ephoneBackCallback.setEnabled(true);
                      getOnBackPressedDispatcher().addCallback(this, ephoneBackCallback);
                  } catch (Exception ignored) {}
              }

              @Override
              public void finish() {
                  if (!allowExplicitExit) {
                      triggerWebViewStepBack();
                      return;
                  }
                  super.finish();
              }

              @Override
              public boolean moveTaskToBack(boolean nonRoot) {
                  if (!allowExplicitExit) {
                      triggerWebViewStepBack();
                      return false;
                  }
                  return super.moveTaskToBack(nonRoot);
              }

              private void ensureNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try {
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) {
                              NotificationChannel ch = new NotificationChannel(
                                  NOTIF_CHANNEL_ID,
                                  "消息弹窗提醒",
                                  NotificationManager.IMPORTANCE_HIGH
                              );
                              ch.setDescription("收到AI回复与密友消息时的顶部悬浮弹窗提醒");
                              ch.enableVibration(true);
                              ch.setVibrationPattern(new long[]{0, 200, 100, 200});
                              ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                              nm.createNotificationChannel(ch);
                          }
                      } catch (Exception ignored) {}
                  }
              }

              public void checkAndRequestNotificationPermission() {
                  ensureNotificationChannel();
                  if (Build.VERSION.SDK_INT >= 33) {
                      try {
                          if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                              ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, REQ_POST_NOTIF);
                          }
                      } catch (Exception ignored) {}
                  }
              }

              public boolean postHeadsUpNotification(String title, String body, String chatId, String tag) {
                  try {
                      ensureNotificationChannel();
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return false;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N && !nm.areNotificationsEnabled()) {
                          checkAndRequestNotificationPermission();
                          return false;
                      }
                      Intent tapIntent = new Intent(this, MainActivity.class);
                      tapIntent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      if (chatId != null && !chatId.isEmpty()) {
                          tapIntent.putExtra("ephone_chat_id", chatId);
                      }
                      int piFlags = PendingIntent.FLAG_UPDATE_CURRENT;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          piFlags |= PendingIntent.FLAG_IMMUTABLE;
                      }
                      int notifId = (tag != null && !tag.isEmpty()) ? Math.abs(tag.hashCode()) : (int) (System.currentTimeMillis() & 0xfffffff);
                      PendingIntent pi = PendingIntent.getActivity(this, notifId, tapIntent, piFlags);

                      int iconId = getApplicationInfo().icon;
                      if (iconId == 0) iconId = android.R.drawable.sym_def_app_icon;

                      NotificationCompat.Builder builder = new NotificationCompat.Builder(this, NOTIF_CHANNEL_ID)
                          .setSmallIcon(iconId)
                          .setContentTitle((title != null && !title.isEmpty()) ? title : "四半世紀")
                          .setContentText((body != null && !body.isEmpty()) ? body : "收到一条新消息")
                          .setStyle(new NotificationCompat.BigTextStyle().bigText((body != null && !body.isEmpty()) ? body : "收到一条新消息"))
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setDefaults(NotificationCompat.DEFAULT_ALL)
                          .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setAutoCancel(true)
                          .setContentIntent(pi);

                      nm.notify(notifId, builder.build());
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  try {
                      if (intent != null && intent.hasExtra("ephone_chat_id")) {
                          final String cid = intent.getStringExtra("ephone_chat_id");
                          if (cid != null && !cid.isEmpty() && this.bridge != null && this.bridge.getWebView() != null) {
                              final String safeCid = cid.replace("'", "\\'");
                              this.bridge.getWebView().post(() -> this.bridge.getWebView().evaluateJavascript(
                                  "if (typeof window.openChat === 'function') { window.openChat('" + safeCid + "'); }",
                                  null
                              ));
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private void triggerWebViewStepBack() {
                  try {
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          final WebView wv = this.bridge.getWebView();
                          wv.post(() -> wv.evaluateJavascript(
                              "if (typeof window.__handleEPhoneBackAction === 'function') { window.__handleEPhoneBackAction(); }",
                              null
                          ));
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  ensureNotificationChannel();
                  checkAndRequestNotificationPermission();
                  ensureTopBackCallback();
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          if (getWindow() != null && getWindow().getDecorView() != null) {
                              getWindow().getDecorView().setImportantForAutofill(View.IMPORTANT_FOR_AUTOFILL_NO_EXCLUDE_DESCENDANTS);
                          }
                          AutofillManager afm = getSystemService(AutofillManager.class);
                          if (afm != null) {
                              afm.cancel();
                          }
                      }
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          WebView webView = this.bridge.getWebView();
                          WebSettings ws = webView.getSettings();
                          ws.setDomStorageEnabled(true);
                          ws.setDatabaseEnabled(true);
                          ws.setJavaScriptCanOpenWindowsAutomatically(true);
                          ws.setAllowFileAccess(true);
                          ws.setAllowContentAccess(true);
                          ws.setSaveFormData(false);
                          ws.setMediaPlaybackRequiresUserGesture(false);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                              ws.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                          }
                          webView.setLongClickable(true);
                          webView.setHapticFeedbackEnabled(true);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              webView.setImportantForAutofill(View.IMPORTANT_FOR_AUTOFILL_NO_EXCLUDE_DESCENDANTS);
                          }
                          webView.addJavascriptInterface(new EPhoneNativeBridge(this), "EPhoneNativeBridge");
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              final WebChromeClient origChrome = webView.getWebChromeClient();
                              if (origChrome != null) {
                                  webView.setWebChromeClient(new WebChromeClient() {
                                      @Override
                                      public void onPermissionRequest(final PermissionRequest request) {
                                          try {
                                              if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                                  ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.RECORD_AUDIO}, REQ_RECORD_AUDIO);
                                              }
                                              runOnUiThread(() -> {
                                                  try {
                                                      request.grant(request.getResources());
                                                  } catch (Exception ignored) {}
                                              });
                                          } catch (Exception e) {
                                              origChrome.onPermissionRequest(request);
                                          }
                                      }
                                      @Override
                                      public boolean onShowFileChooser(WebView wv, android.webkit.ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                                          return origChrome.onShowFileChooser(wv, filePathCallback, fileChooserParams);
                                      }
                                  });
                              }
                          }
                      }
                      checkAndApplyPersistedHotUpdate();
                  } catch (Exception ignored) {}
              }

              @Override
              public void onStart() {
                  super.onStart();
                  ensureTopBackCallback();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  ensureTopBackCallback();
              }

              @Override
              public void onBackPressed() {
                  triggerWebViewStepBack();
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              public boolean onKeyUp(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      triggerWebViewStepBack();
                      return true;
                  }
                  return super.onKeyUp(keyCode, event);
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  if (event != null && event.getKeyCode() == KeyEvent.KEYCODE_BACK) {
                      if (event.getAction() == KeyEvent.ACTION_UP && !event.isCanceled()) {
                          triggerWebViewStepBack();
                      }
                      return true;
                  }
                  return super.dispatchKeyEvent(event);
              }

              public File getLocalVaultRootDir() {
                  File base = getExternalFilesDir(null);
                  if (base == null) base = getFilesDir();
                  File vaultDir = new File(base, "EPhoneVault");
                  if (!vaultDir.exists()) {
                      vaultDir.mkdirs();
                  }
                  File nomedia = new File(vaultDir, ".nomedia");
                  if (!nomedia.exists()) {
                      try { nomedia.createNewFile(); } catch (Exception ignored) {}
                  }
                  return vaultDir;
              }

              private long getCurrentApkUpdateTime() {
                  try {
                      PackageInfo pi = getPackageManager().getPackageInfo(getPackageName(), 0);
                      return pi != null ? pi.lastUpdateTime : 0L;
                  } catch (Exception e) {
                      return 0L;
                  }
              }

              private void deleteDirRecursively(File f) {
                  if (f == null || !f.exists()) return;
                  if (f.isDirectory()) {
                      File[] children = f.listFiles();
                      if (children != null) {
                          for (File c : children) {
                              deleteDirRecursively(c);
                          }
                      }
                  }
                  try { f.delete(); } catch (Exception ignored) {}
              }

              private void copyAssetsRecursively(AssetManager am, String assetPath, File destDir) {
                  try {
                      String[] list = am.list(assetPath);
                      if (list != null && list.length > 0) {
                          if (!destDir.exists()) destDir.mkdirs();
                          for (String child : list) {
                              String childAssetPath = assetPath.isEmpty() ? child : (assetPath + "/" + child);
                              copyAssetsRecursively(am, childAssetPath, new File(destDir, child));
                          }
                      } else {
                          if (destDir.exists()) return;
                          File parent = destDir.getParentFile();
                          if (parent != null && !parent.exists()) parent.mkdirs();
                          try (InputStream is = am.open(assetPath);
                               FileOutputStream fos = new FileOutputStream(destDir)) {
                              byte[] buf = new byte[8192];
                              int n;
                              while ((n = is.read(buf)) > 0) {
                                  fos.write(buf, 0, n);
                              }
                              fos.flush();
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private void checkAndApplyPersistedHotUpdate() {
                  try {
                      File hotDir = new File(getFilesDir(), "hot_update_www");
                      File markerFile = new File(hotDir, ".apk_update_time");
                      File indexFile = new File(hotDir, "index.html");
                      if (!hotDir.exists() || !indexFile.exists()) return;
                      long curApkTime = getCurrentApkUpdateTime();
                      long savedApkTime = 0L;
                      if (markerFile.exists()) {
                          try (FileInputStream fis = new FileInputStream(markerFile);
                               ByteArrayOutputStream bos = new ByteArrayOutputStream()) {
                              byte[] buf = new byte[128];
                              int r;
                              while ((r = fis.read(buf)) > 0) bos.write(buf, 0, r);
                              savedApkTime = Long.parseLong(new String(bos.toByteArray(), StandardCharsets.UTF_8).trim());
                          } catch (Exception ignored) {}
                      }
                      if (curApkTime > 0 && savedApkTime != curApkTime) {
                          deleteDirRecursively(hotDir);
                          return;
                      }
                      if (this.bridge != null) {
                          this.bridge.setServerBasePath(hotDir.getAbsolutePath());
                      }
                  } catch (Exception ignored) {}
              }

              public boolean prepareHotUpdateWorkspace() {
                  try {
                      File hotDir = new File(getFilesDir(), "hot_update_www");
                      if (!hotDir.exists()) hotDir.mkdirs();
                      copyAssetsRecursively(getAssets(), "public", hotDir);
                      long curApkTime = getCurrentApkUpdateTime();
                      File markerFile = new File(hotDir, ".apk_update_time");
                      try (FileOutputStream fos = new FileOutputStream(markerFile)) {
                          fos.write(String.valueOf(curApkTime).getBytes(StandardCharsets.UTF_8));
                          fos.flush();
                      }
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              public boolean writeHotUpdateFile(String relativePath, String content) {
                  try {
                      if (relativePath == null || relativePath.trim().isEmpty() || content == null) return false;
                      String cleanRel = relativePath.trim().replaceAll("^/+", "");
                      if (cleanRel.contains("..")) return false;
                      File hotDir = new File(getFilesDir(), "hot_update_www");
                      if (!hotDir.exists()) {
                          prepareHotUpdateWorkspace();
                      }
                      File outFile = new File(hotDir, cleanRel);
                      File parent = outFile.getParentFile();
                      if (parent != null && !parent.exists()) parent.mkdirs();
                      try (FileOutputStream fos = new FileOutputStream(outFile)) {
                          fos.write(content.getBytes(StandardCharsets.UTF_8));
                          fos.flush();
                      }
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              public boolean activateHotUpdateWorkspace() {
                  try {
                      final File hotDir = new File(getFilesDir(), "hot_update_www");
                      final File indexFile = new File(hotDir, "index.html");
                      if (!indexFile.exists() || this.bridge == null) return false;
                      runOnUiThread(() -> {
                          try {
                              if (MainActivity.this.bridge.getWebView() != null) {
                                  MainActivity.this.bridge.getWebView().clearCache(true);
                              }
                              MainActivity.this.bridge.setServerBasePath(hotDir.getAbsolutePath());
                          } catch (Exception ignored) {}
                      });
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              public static class EPhoneNativeBridge {
                  private final MainActivity activity;
                  private final Context ctx;

                  public EPhoneNativeBridge(MainActivity act) {
                      this.activity = act;
                      this.ctx = act;
                  }

                  @JavascriptInterface
                  public void exitApp() {
                      if (activity != null) {
                          activity.runOnUiThread(() -> {
                              try {
                                  activity.allowExplicitExit = true;
                                  activity.moveTaskToBack(true);
                                  activity.finish();
                              } catch (Exception ignored) {}
                          });
                      }
                  }

                  @JavascriptInterface
                  public boolean prepareHotUpdateDir() {
                      return activity != null && activity.prepareHotUpdateWorkspace();
                  }

                  @JavascriptInterface
                  public boolean saveHotUpdateFile(String relativePath, String content) {
                      return activity != null && activity.writeHotUpdateFile(relativePath, content);
                  }

                  @JavascriptInterface
                  public boolean applyHotUpdate() {
                      return activity != null && activity.activateHotUpdateWorkspace();
                  }

                  @JavascriptInterface
                  public boolean showNativeNotification(String title, String body, String chatId, String tag) {
                      return activity != null && activity.postHeadsUpNotification(title, body, chatId, tag);
                  }

                  @JavascriptInterface
                  public void requestNotificationPermission() {
                      if (activity != null) {
                          activity.runOnUiThread(() -> {
                              try {
                                  activity.checkAndRequestNotificationPermission();
                              } catch (Exception ignored) {}
                          });
                      }
                  }

                  @JavascriptInterface
                  public boolean hasNotificationPermission() {
                      try {
                          NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                              return nm.areNotificationsEnabled();
                          }
                          return true;
                      } catch (Exception e) {
                          return true;
                      }
                  }

                  @JavascriptInterface
                  public boolean openExternalUrl(String url) {
                      try {
                          if (url == null || url.trim().isEmpty()) return false;
                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url.trim()));
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(intent);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean copyToClipboard(String text) {
                      try {
                          final String safeText = text != null ? text : "";
                          if (activity != null) {
                              activity.runOnUiThread(() -> {
                                  try {
                                      ClipboardManager cm = (ClipboardManager) ctx.getSystemService(Context.CLIPBOARD_SERVICE);
                                      if (cm != null) {
                                          cm.setPrimaryClip(ClipData.newPlainText("text", safeText));
                                      }
                                  } catch (Exception ignored) {}
                              });
                              return true;
                          }
                          ClipboardManager cm = (ClipboardManager) ctx.getSystemService(Context.CLIPBOARD_SERVICE);
                          if (cm != null) {
                              cm.setPrimaryClip(ClipData.newPlainText("text", safeText));
                              return true;
                          }
                      } catch (Exception ignored) {}
                      return false;
                  }

                  @JavascriptInterface
                  public String readFromClipboard() {
                      try {
                          ClipboardManager cm = (ClipboardManager) ctx.getSystemService(Context.CLIPBOARD_SERVICE);
                          if (cm != null && cm.hasPrimaryClip()) {
                              ClipData clip = cm.getPrimaryClip();
                              if (clip != null && clip.getItemCount() > 0) {
                                  CharSequence cs = clip.getItemAt(0).coerceToText(ctx);
                                  if (cs != null) return cs.toString();
                              }
                          }
                      } catch (Exception ignored) {}
                      return "";
                  }

                  private File resolveSafeVaultFile(String relativePath) {
                      if (activity == null || relativePath == null) return null;
                      String clean = relativePath.trim().replace('\\', '/').replaceAll("^/+", "");
                      if (clean.isEmpty() || clean.contains("..")) return null;
                      return new File(activity.getLocalVaultRootDir(), clean);
                  }

                  @JavascriptInterface
                  public String vaultGetDirPath() {
                      try {
                          return activity != null ? activity.getLocalVaultRootDir().getAbsolutePath() : "";
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public boolean vaultWriteBase64(String relativePath, String base64Data) {
                      try {
                          File f = resolveSafeVaultFile(relativePath);
                          if (f == null || base64Data == null) return false;
                          File parent = f.getParentFile();
                          if (parent != null && !parent.exists()) parent.mkdirs();
                          String pure = base64Data;
                          int comma = pure.indexOf(',');
                          if (comma >= 0) pure = pure.substring(comma + 1);
                          byte[] bytes = pure.isEmpty() ? new byte[0] : Base64.decode(pure, Base64.DEFAULT);
                          try (FileOutputStream fos = new FileOutputStream(f)) {
                              fos.write(bytes);
                              fos.flush();
                          }
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public String vaultReadBase64(String relativePath) {
                      try {
                          File f = resolveSafeVaultFile(relativePath);
                          if (f == null || !f.exists() || !f.isFile()) return "";
                          try (FileInputStream fis = new FileInputStream(f);
                               ByteArrayOutputStream bos = new ByteArrayOutputStream()) {
                              byte[] buf = new byte[16384];
                              int n;
                              while ((n = fis.read(buf)) > 0) {
                                  bos.write(buf, 0, n);
                              }
                              return Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP);
                          }
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public boolean vaultWriteText(String relativePath, String content) {
                      try {
                          File f = resolveSafeVaultFile(relativePath);
                          if (f == null || content == null) return false;
                          File parent = f.getParentFile();
                          if (parent != null && !parent.exists()) parent.mkdirs();
                          try (FileOutputStream fos = new FileOutputStream(f)) {
                              fos.write(content.getBytes(StandardCharsets.UTF_8));
                              fos.flush();
                          }
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public String vaultReadText(String relativePath) {
                      try {
                          File f = resolveSafeVaultFile(relativePath);
                          if (f == null || !f.exists() || !f.isFile()) return "";
                          try (FileInputStream fis = new FileInputStream(f);
                               ByteArrayOutputStream bos = new ByteArrayOutputStream()) {
                              byte[] buf = new byte[16384];
                              int n;
                              while ((n = fis.read(buf)) > 0) {
                                  bos.write(buf, 0, n);
                              }
                              return new String(bos.toByteArray(), StandardCharsets.UTF_8);
                          }
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public boolean vaultDeleteFile(String relativePath) {
                      try {
                          File f = resolveSafeVaultFile(relativePath);
                          if (f != null && f.exists()) {
                              return f.delete();
                          }
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public String vaultListFiles(String subDir) {
                      try {
                          if (activity == null) return "[]";
                          File base = activity.getLocalVaultRootDir();
                          File target = (subDir == null || subDir.trim().isEmpty())
                              ? base
                              : resolveSafeVaultFile(subDir);
                          if (target == null || !target.exists() || !target.isDirectory()) return "[]";
                          File[] files = target.listFiles();
                          if (files == null) return "[]";
                          JSONArray arr = new JSONArray();
                          for (File f : files) {
                              if (f != null && f.isFile()) {
                                  JSONObject obj = new JSONObject();
                                  obj.put("name", f.getName());
                                  obj.put("size", f.length());
                                  arr.put(obj);
                              }
                          }
                          return arr.toString();
                      } catch (Exception e) {
                          return "[]";
                      }
                  }

                  @JavascriptInterface
                  public boolean saveFileToDownloads(String base64Data, String fileName, String mimeType) {
                      try {
                          if (base64Data == null || base64Data.isEmpty()) return false;
                          String pureB64 = base64Data;
                          int commaIdx = pureB64.indexOf(',');
                          if (commaIdx >= 0) {
                              pureB64 = pureB64.substring(commaIdx + 1);
                          }
                          byte[] bytes = Base64.decode(pureB64, Base64.DEFAULT);
                          if (bytes == null) return false;
                          String safeName = (fileName != null && !fileName.trim().isEmpty()) ? fileName.trim() : ("export_" + System.currentTimeMillis() + ".json");
                          String safeMime = (mimeType != null && !mimeType.trim().isEmpty()) ? mimeType.trim() : "application/octet-stream";

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentResolver resolver = ctx.getContentResolver();
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.MediaColumns.DISPLAY_NAME, safeName);
                              values.put(MediaStore.MediaColumns.MIME_TYPE, safeMime);
                              values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/四半世紀");
                              values.put(MediaStore.MediaColumns.IS_PENDING, 1);
                              Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  try (OutputStream os = resolver.openOutputStream(uri)) {
                                      if (os != null) {
                                          os.write(bytes);
                                          os.flush();
                                      }
                                  }
                                  ContentValues doneValues = new ContentValues();
                                  doneValues.put(MediaStore.MediaColumns.IS_PENDING, 0);
                                  resolver.update(uri, doneValues, null, null);
                                  return true;
                              }
                          }

                          File dlDir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "四半世紀");
                          if (!dlDir.exists()) dlDir.mkdirs();
                          File outFile = new File(dlDir, safeName);
                          try (FileOutputStream fos = new FileOutputStream(outFile)) {
                              fos.write(bytes);
                              fos.flush();
                          }
                          MediaScannerConnection.scanFile(ctx, new String[]{outFile.getAbsolutePath()}, new String[]{safeMime}, null);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean saveBase64ToDownloads(String base64Data, String fileName, String mimeType, String subFolder) {
                      try {
                          if (base64Data == null || base64Data.isEmpty()) return false;
                          String pureB64 = base64Data;
                          int commaIdx = pureB64.indexOf(',');
                          if (commaIdx >= 0) {
                              pureB64 = pureB64.substring(commaIdx + 1);
                          }
                          byte[] bytes = Base64.decode(pureB64, Base64.DEFAULT);
                          if (bytes == null || bytes.length == 0) return false;
                          String safeName = (fileName != null && !fileName.trim().isEmpty()) ? fileName.trim() : ("NAI_" + System.currentTimeMillis() + ".png");
                          String safeMime = (mimeType != null && !mimeType.trim().isEmpty()) ? mimeType.trim() : (safeName.toLowerCase().endsWith(".jpg") || safeName.toLowerCase().endsWith(".jpeg") ? "image/jpeg" : "image/png");
                          String folderName = (subFolder != null && !subFolder.trim().isEmpty()) ? subFolder.trim() : "徒花";

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentResolver resolver = ctx.getContentResolver();
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.MediaColumns.DISPLAY_NAME, safeName);
                              values.put(MediaStore.MediaColumns.MIME_TYPE, safeMime);
                              values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DCIM + "/" + folderName);
                              values.put(MediaStore.MediaColumns.IS_PENDING, 1);
                              Uri uri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values);
                              if (uri == null) {
                                  values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/" + folderName);
                                  uri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values);
                              }
                              if (uri != null) {
                                  try (OutputStream os = resolver.openOutputStream(uri)) {
                                      if (os != null) {
                                          os.write(bytes);
                                          os.flush();
                                      }
                                  }
                                  ContentValues doneValues = new ContentValues();
                                  doneValues.put(MediaStore.MediaColumns.IS_PENDING, 0);
                                  resolver.update(uri, doneValues, null, null);
                                  try {
                                      File dcimFile = new File(new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DCIM), folderName), safeName);
                                      MediaScannerConnection.scanFile(ctx, new String[]{dcimFile.getAbsolutePath()}, new String[]{safeMime}, null);
                                  } catch (Exception ignored) {}
                                  return true;
                              }
                          }

                          File baseDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DCIM);
                          File targetDir = new File(baseDir, folderName);
                          if (!targetDir.exists()) {
                              targetDir.mkdirs();
                          }
                          File outFile = new File(targetDir, safeName);
                          try (FileOutputStream fos = new FileOutputStream(outFile)) {
                              fos.write(bytes);
                              fos.flush();
                          }
                          MediaScannerConnection.scanFile(ctx, new String[]{outFile.getAbsolutePath()}, new String[]{safeMime}, null);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }
              }
          }
          EOF
            if [ -n "$PKG_LINE" ]; then
              sed -i "1s|^package .*|$PKG_LINE|" "$MAIN_ACT" || true
            fi
          fi

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../EPhone.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPhone-Android-APK
          path: EPhone.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: 小手机安卓安装包最新版
          body: 点击下方 EPhone.apk 即可直接下载安装到手机
          files: EPhone.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
